<script>
(()=>{'use strict';
const KEY='h4_goal_quest_v4';const today=()=>localISO(new Date());function localISO(value){const d=new Date(value);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function shift(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localISO(d)};const week=()=>Array.from({length:7},(_,i)=>shift(today(),i));const dayname=d=>new Date(d+'T12:00:00').toLocaleDateString('en-CA',{weekday:'short'});const dated=d=>new Date(d+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'});const id=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const worlds=[{id:'school',label:'School & Future',icon:'🎓',name:'Astri',color:'#aea2ff',dark:'#6965b7',task:['Review notes for 15 minutes','Ask a teacher for feedback','Complete one practice activity'],sample:['Improve my math grade','Finish my science project','Prepare for a career']},{id:'money',label:'Money & Independence',icon:'💰',name:'Coino',color:'#ffe097',dark:'#b98630',task:['Write down what I spent today','Put aside a small amount','Compare two prices'],sample:['Save $200','Build a weekly budget','Learn how interest works']},{id:'health',label:'Health & Fitness',icon:'💪',name:'Embi',color:'#ffb8a6',dark:'#d36e5e',task:['Move for 20 minutes','Prepare a healthy snack','Plan a bedtime routine'],sample:['Exercise three times a week','Improve my running endurance','Get more consistent sleep']},{id:'learning',label:'Learning & Growth',icon:'📚',name:'Glimo',color:'#a5dafb',dark:'#6293c6',task:['Practise my skill for 15 minutes','Learn one new technique','Show someone what I learned'],sample:['Learn a breaking routine','Read five books','Learn basic coding']},{id:'family',label:'Family & Relationships',icon:'🏡',name:'Hugo',color:'#ffc2d8',dark:'#d47b9d',task:['Plan a shared activity','Ask how someone is doing','Have a screen-free conversation'],sample:['Spend more time with family','Improve how I listen','Be more helpful at home']},{id:'community',label:'Friends & Community',icon:'🤝',name:'Sprig',color:'#a2edb2',dark:'#47a97a',task:['Contact one person','Research a club or volunteer opportunity','Plan a small group activity'],sample:['Join a new school club','Volunteer in my community','Organize a school event']},{id:'purpose',label:'Purpose & Values',icon:'🧭',name:'Luma',color:'#e8c0ff',dark:'#a47bce',task:['Write one meaningful reflection','Choose one helpful action','Spend 10 quiet minutes reflecting'],sample:['Build a gratitude habit','Explore what matters to me','Make time for an important value']}];const world=k=>worlds.find(w=>w.id===k)||worlds[0];
const goal=(category,title,success,nDays,planned,done=0)=>({id:id(),category,title,success,why:'',date:shift(today(),nDays),dateType:'target',createdAt:new Date().toISOString(),tasks:planned.map((t,i)=>({id:id(),title:t,due:shift(today(),i%7),doneAt:i<done?new Date().toISOString():null,createdAt:new Date().toISOString()})),plus:{challenge:5,primer:'',partner:'',contract:false},woop:{wish:'',opportunity:'',obstacle:'',plan:''},notes:[],checkins:[],milestones:[],archived:false});
function initial(){const a=goal('learning','Learn a breaking routine','Confidently perform a 60-second routine',35,['Practise two top-rock steps for 15 minutes','Record my first practice video','Learn one new move','Review the routine with a friend','Practise transitions'],1);a.why='I want to feel confident performing in front of others.';a.plus.primer='Put my dance shoes by my bedroom door';a.woop={wish:'Perform a breaking routine',opportunity:'I will feel more confident',obstacle:'I get distracted after school',plan:'If I start scrolling videos, then I will put my phone away and practise one move.'};let b=goal('school','Improve my math grade','Score at least 80% on my next test',28,['Review algebra notes for 15 minutes','Complete 10 practice questions','Ask my teacher one question'],0);return {goals:[a,b],selected:a.id,screen:'home',draft:null,wheel:{},lessons:{},journal:[],momentum:0,notesViewed:false,focus:{minutes:25},demo:true,version:4};}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch{state=initial()}if(!state||!Array.isArray(state.goals))state=initial();state.lessons||={};state.wheel||={};state.journal||=[];let timer=null,seconds=25*60,running=false,timerEnd=0;function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('#saved-status').textContent='● Saved on this device'}catch{document.querySelector('#saved-status').textContent='⚠ Local storage unavailable'}}function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.handle);toast.handle=setTimeout(()=>e.classList.remove('show'),2800)}function current(){return state.goals.find(g=>g.id===state.selected)||state.goals[0]}function taskCount(g){const n=g.tasks.filter(t=>t.doneAt).length;return{n,total:g.tasks.length,pct:g.tasks.length?Math.round(100*n/g.tasks.length):0}}function gxp(g){const task=Math.min(g.tasks.filter(t=>t.doneAt).length,300)*35;const acts=Math.min(g.checkins.length,100)*10;const woop=g.woop?.plan?25:0;const smart=g.plus?.contract?20:0;return task+acts+woop+smart}function stage(g){return clamp(1+Math.floor(gxp(g)/145),1,4)}function allXP(){return state.goals.reduce((n,g)=>n+gxp(g),0)}function playerLevel(){return 1+Math.floor(allXP()/170)}function xpToNext(g){let x=gxp(g);let next=stage(g)*145;return stage(g)===4?100:Math.min(100,Math.floor(x/next*100))}
function momentumPanel(){const start=shift(today(),-6),now=today();let done=0,overdue=0;for(const g of state.goals)for(const t of g.tasks){if(t.doneAt&&localISO(t.doneAt)>=start&&localISO(t.doneAt)<=now)done++;else if(!t.doneAt&&t.due<now)overdue++}const checks=state.journal.filter(x=>x.date>=start&&x.date<=now).length;const rating=clamp(700+22*done+10*checks-9*overdue,600,1100);return `<section class="card"><div class="flex between"><div><div class="eyebrow">PERSONAL MOMENTUM</div><h2 style="font-size:29px;margin:0;letter-spacing:-1.2px">${rating} <span class="small muted" style="font-weight:600">/ 1100</span></h2></div><span style="font-size:34px">📈</span></div><div class="progress" style="margin:11px 0"><div style="width:${(rating-600)/5}%"></div></div><div class="small muted">Your own recent follow-through, not a public leaderboard. Real progress moves your rating; you can always recover after a hard week.</div></section>`}
function mascot(g,size=140){const w=world(g.category),s=stage(g),a=esc(w.name),hex=w.color,shade=w.dark,ears=s>1?`<path d="M61 84Q32 51 47 29q24-2 43 34M136 65q20-44 45-34 5 34-21 54" fill="${hex}" stroke="${shade}" stroke-width="5" stroke-linejoin="round"/>`:`<path d="M99 55Q82 34 97 24Q111 36 109 58" fill="#8de1a9" stroke="#4d9a75" stroke-width="4"/>`;const wings=s>2?`<path d="M65 117Q11 71 23 129q9 37 60 28M155 117q53-46 42 12-8 34-56 28" fill="${s===4?'#f8e3a6':'#d3c7ff'}" stroke="${shade}" stroke-width="3"/>`:'';const crown=s===4?`<path d="M87 50L78 26L103 40L115 17L129 40L152 26L143 51" fill="#ffdf78" stroke="#dbab48" stroke-width="4" stroke-linejoin="round"/>`:'';return `<svg class="mascot" style="width:${size}px;height:${size}px" viewBox="0 0 230 230" role="img" aria-label="${a} companion evolution stage ${s}" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="gr${esc(g.id)}" cx="34%" cy="19%"><stop stop-color="#fff" stop-opacity=".67"/><stop offset=".62" stop-color="${hex}"/><stop offset="1" stop-color="${shade}"/></radialGradient></defs><ellipse cx="115" cy="199" rx="59" ry="12" fill="#141934" opacity=".16"/>${wings}${ears}${crown}<path d="M58 136Q53 79 87 65Q118 45 149 69Q183 94 175 149Q175 195 118 197Q58 198 58 136Z" fill="url(#gr${esc(g.id)})" stroke="${shade}" stroke-width="4"/><ellipse cx="90" cy="127" rx="10" ry="13" fill="#202747"/><ellipse cx="143" cy="127" rx="10" ry="13" fill="#202747"/><circle cx="93" cy="122" r="3.4" fill="white"/><circle cx="146" cy="122" r="3.4" fill="white"/><path d="M107 150Q116 162 126 150" fill="none" stroke="#3b4057" stroke-width="4" stroke-linecap="round"/><ellipse cx="78" cy="145" rx="12" ry="6" fill="#f67e9a" opacity=".6"/><ellipse cx="157" cy="145" rx="12" ry="6" fill="#f67e9a" opacity=".6"/><path d="M78 180q-13 9-2 17M151 180q13 9 2 17" stroke="${shade}" stroke-width="8" stroke-linecap="round"/>${s>2?'<path d="M105 168l12 9 12-9" fill="none" stroke="#fdf3ff" stroke-width="4"/>':''}<circle cx="48" cy="95" r function tagGoal(g){return `<span class="pill">${world(g.category).icon} ${esc(world(g.category).label)}</span>`};function progress(g){let t=taskCount(g);return `<div class="flex between small muted"><span>Action progress</span><b>${t.n}/${t.total} done</b></div><div class="progress"><div style="width:${t.pct}%"></div></div>`}function quest(g){if(!g)return '';return `<div class="companion"><div class="flex between"><span class="micro" style="color:#a9ffee">YOUR GOAL COMPANION</span><span class="pill">Stage ${stage(g)}/4</span></div>${mascot(g,140)}<div class="flex between"><div><b style="font-size:18px">${esc(world(g.category).name)}</b><div class="small muted">${['','New adventurer','Growing stronger','Explorer','Guardian'][stage(g)]}</div></div><span class="pill green">${gxp(g)} XP</span></div><div style="height:9px"></div><div class="progress"><div style="width:${xpToNext(g)}%"></div></div><div class="tiny muted" style="margin-top:8px">${stage(g)===4?'Final form unlocked!':'Complete meaningful actions to unlock the next form.'}</div></div>`}
function home(){let goals=state.goals.filter(g=>!g.archived),g=current();if(!g){screen(`<div class="card"><h1>Begin your adventure</h1><button class="btn" data-act="new-goal">Create a goal</button></div>`);return}let todays=goals.flatMap(g=>g.tasks.filter(t=>t.due<=today()&&!t.doneAt).map(t=>({g,t}))),finished=goals.flatMap(g=>g.tasks.filter(t=>t.doneAt&&localISO(t.doneAt)===today()).map(t=>({g,t})));const next=todays[0]||goals.flatMap(g=>g.tasks.filter(t=>!t.doneAt).map(t=>({g,t}))).sort((a,b)=>a.t.due.localeCompare(b.t.due))[0];const completedAll=goals.reduce((n,g)=>n+g.tasks.filter(t=>t.doneAt).length,0);const totalAll=goals.reduce((n,g)=>n+g.tasks.length,0);let banner=next?`<div class="flex" style="align-items:flex-start"><span style="font-size:22px">🎯</span><div class="grow"><b style="font-size:14px">Your next move</b><div style="font-size:13px;margin:5px 0">${esc(next.t.title)}</div><span class="small muted">${esc(next.g.title)} · ${dated(next.t.due)}</span></div><button class="btn sm" data-done="${esc(next.t.id)}">Done ✓</button></div>`:`<div class="flex between"><div>All caught up. Schedule your next quest!</div><button class="btn sm" data-act="add-task">Add task</button></div>`;
const latest=state.journal.filter(e=>e.date===today()).at(-1);screen(`<div class="eyebrow">YOUR QUEST BEGINS HERE</div><h1 class="h1">Make today count<span style="color:#7467ea">.</span></h1><p class="lead">A few small actions today can lead to something extraordinary. Your progress is your story.</p><div class="cols"><div class="stack"><section class="card hero"><div class="hero-inner"><div><div class="eyebrow">✦ YOUR ADVENTURE</div><h2 class="h2">Every action helps your companion grow.</h2><p>Level up in real life, one meaningful step at a time.</p><button class="btn" data-nav="goals">See my goal collection →</button></div>${mascot(g,170)}</div></section><section class="card"><div class="split-title"><h2 class="h2">Today's quests</h2><button class="btn line sm" data-act="add-task">+ Add action</button></div><div class="preview" style="margin-bottom:14px">${banner}</div>${todays.length||finished.length?[...todays,...finished].slice(0,7).map(({g,t})=>taskItem(g,t)).join(''):`<div class="empty">No tasks due today. Add a manageable first step.</div>`}<div class="flex between" style="margin-top:17px"><button class="btn alt sm" data-act="checkin">${latest?'Edit daily check-in':'✓ 30-second check-in'}</button><button class="btn line sm" data-nav="week">Open planner →</button></div></section><section class="card"><div class="split-title"><h2 class="h2">Your next seven days</h2><button class="btn line sm" data-nav="week">View week →</button></div>${weekStrip()}<div class="stats3" style="margin-top:16px"><div class="metric"><strong>${completedAll}</strong><span>Actions finished</span></div><div class="metric"><strong>${totalAll}</strong><span>Actions planned</span></div><div class="metric"><strong>${goals.length}</strong><span>Goal companions</span></div></div></section></div><div class="stack">${quest(g)}${momentumPanel()}<section class="card"><div class="eyebrow">✦ NEXT STORY CHAPTER</div><h2 class="h2">Learn your superpowers</h2><p class="small muted">Build great goals, function taskItem(g,t){return `<div class="task ${t.doneAt?'done':''}"><button class="check ${t.doneAt?'done':''}" data-done="${esc(t.id)}" aria-label="${t.doneAt?'Reopen':'Complete'} ${esc(t.title)}">✓</button><div class="grow"><div class="tasktitle">${esc(t.title)}</div><div class="taskmeta">${world(g.category).icon} ${esc(g.title)} · ${dated(t.due)}</div></div><button class="iconbtn" data-move="${esc(t.id)}" aria-label="Reschedule task">↗</button></div>`}function weekStrip(){return `<div class="weekstrip">${week().map(d=>{let ts=state.goals.flatMap(g=>g.tasks.filter(t=>t.due===d)),dn=ts.filter(t=>t.doneAt).length;return `<button class="daytile ${d===today()?'today':''} ${ts.length&&dn===ts.length?'complete':''}" data-nav="week"><span>${dayname(d)}</span><strong>${new Date(d+'T12:00:00').getDate()}</strong><div class="dot"></div></button>`}).join('')}</div>`}
function weekView(){const ds=week();let count=state.goals.flatMap(g=>g.tasks.filter(t=>ds.includes(t.due))).length;screen(`<div class="eyebrow">THE SEVEN-DAY PLANNER</div><h1 class="h1">Plan your next moves.</h1><p class="lead">Goals can last months. Your seven-day plan keeps them manageable. Include breathing room: rest is part of the strategy.</p><div class="cols"><div class="stack"><section class="card"><div class="split-title"><h2 class="h2">${dated(ds[0])} – ${dated(ds[6])}</h2><span class="pill">${count} planned actions</span></div>${weekStrip()}<div class="helper">🌿 Leave unscheduled time for friends, rest, and surprises. Don't fill every hour.</div></section><section class="card"><div class="split-title"><h2 class="h2">Your schedule</h2><button class="btn sm" data-act="add-task">+ Plan an action</button></div><div class="stack">${ds.map(d=>{let arr=state.goals.flatMap(g=>g.tasks.filter(t=>t.due===d).map(t=>({g,t})));return `<div class="daygroup ${d===today()?'today':''}"><div class="flex between"><b>${dayname(d)}, ${dated(d)} ${d===today()?'<span class="pill green">Today</span>':''}</b><button class="btn sm line" data-add-date="${d}">+ Task</button></div>${arr.length?arr.map(({g,t})=>taskItem(g,t)).join(''):'<p class="small muted">Free time / rest — no tasks scheduled.</p>'}</div>`}).join('')}</div></section></div><div class="stack"><section class="card"><div class="eyebrow">⏳ FOCUS QUEST</div><h2 class="h2">Pomodoro timer</h2><p class="small muted">Work in short, focused bursts, then take a real break.</p><div class="focusdisplay" id="timer-display">25:00</div><div class="chips" style="justify-content:center;margin-bottom:15px"><button class="chip active" data-minutes="25">25-min focus</button><button class="chip" data-minutes="5">5-min break</button><button class="chip" data-minutes="15">15-min focus</button></div><div class="flex"><button class="btn grow" id="timer-toggle" data-act="timer-toggle">Start focus</button><button class="btn line" data-act="time function coach(){const g=current();screen(`<div class="eyebrow">OPTIONAL · NO API CONNECTION</div><h1 class="h1">Your coach, your choice.</h1><p class="lead">Choose a ready-to-use coaching prompt. Copy it into an external LLM you already use, then decide what to apply to your goal. Capstone itself sends nothing to AI.</p><div class="cols"><div class="stack">${Object.entries(prompts).map(([k,p])=>`<section class="card"><div class="flex between"><div><div class="eyebrow">✦ COPY & PASTE COACHING</div><h2 class="h2">${esc(p.title)}</h2></div><span class="pill">Optional</span></div><p class="small muted">${esc(p.desc)}</p><div class="flex wrap"><button class="btn" data-prompt="${k}">Copy coach prompt ↗</button><button class="btn line" data-prompt-view="${k}">Preview</button></div></section>`).join('')}</div><div class="stack"><section class="card"><div class="eyebrow">HOW IT WORKS</div><div style="display:grid;gap:14px"><div><b>1. Choose a coach</b><div class="small muted">Pick help with a goal, WOOP, check-ins or planning.</div></div><div><b>2. Copy the prompt</b><div class="small muted">Open ChatGPT, Gemini or another permitted tool.</div></div><div><b>3. Have a conversation</b><div class="small muted">The coach will ask simple questions, one at a time.</div></div><div><b>4. Bring back your ideas</b><div class="small muted">Edit your goal and actions yourself inside Capstone.</div></div></div></section><div class="sectionnote">For students: follow your school and AI provider's age/account rules. Never paste private journal entries, health information, passwords or other people's details into a public chatbot.</div></div></div>`)}
function wizardBlank(){return {step:0,category:'learning',title:'',why:'',success:'',agree:'',realistic:'',date:shift(today(),35),dateType:'target',tasks:[],schedule:{}}}function wizard(){const d=state.draft||wizardBlank();state.draft=d;const steps=['Choose your world','Make it SMART','Choose first moves','Plan seven days','Begin your adventure'];let h='';if(d.step===0)h=`<h2 class="h2">What part of life would you like to grow?</h2><p class="muted small">Pick an area. You can change this later.</p><div class="choicegrid">${worlds.map(w=>`<button class="choice ${d.category===w.id?'active':''}" data-category="${w.id}"><span>${w.icon}</span>${esc(w.label)}</button>`).join('')}</div><div class="helper"><b>Not sure where to start?</b> Explore your Wheel of Life first. <button class="btn alt sm" data-lesson="wheel">Find a goal idea</button></div><div class="field"><label>What's one thing you'd like to accomplish?</label><input id="w-title" data-draft="title" maxlength="120" placeholder="e.g. Learn a new breaking move" value="${esc(d.title)}"/></div><div class="field"><label>Why does this matter to you? <span class="muted small">Optional</span></label><textarea data-draft="why" placeholder="e.g. I want to feel more confident">${esc(d.why)}</textarea></div><div class="chips">${world(d.category).sample.map(s=>`<button class="chip" data-example="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
if(d.step===1)h=`<h2 class="h2">Let's make your goal SMART.</h2><p class="muted small">Five short questions. No perfect answers—just a plan that makes sense to you.</p><div class="field"><label>🎯 Specific — what exactly will you accomplish?</label><input data-draft="title" maxlength="120" value="${esc(d.title)}" placeholder="Learn a 60-second dance routine"/><div class="hint">Be clear enough that someone else understands your goal.</div></div><div class="field"><label>📏 Measurable — how will you know you've achieved it?</label><textarea data-draft="success" placeholder="I can perform my routine confidently for 60 seconds">${esc(d.success)}</textarea><div class="hint">Numbers, observable results, or completed milestones all count.</div></div><div class="field"><label>🤝 Agreed Upon — does it align with what you want?</label><select data-draft="agree"><option value="">Choose your answer</option><option ${d.agree==='yes'?'selected':''} value="yes">Yes, I chose this for myself</option><option ${d.agree==='group'?'selected':''} value="group">This is a group goal we agreed on</option><option ${d.agree==='reconsider'?'selected':''} value="reconsider">I want to adjust it first</option></select></div><div class="field"><label>💪 Realistic — why do you think you can work toward it?</label><input data-draft="realistic" value="${esc(d.realistic)}" placeholder="I can practise 15 minutes after school"/><div class="hint">It's okay if it feels challenging. Name a first step you can manage.</div></div><div class="field"><label>🗓️ Timely — choose a goal or progress-review date</label><div class="flex"><select data-draft="dateType" style="max-width:180px"><option value="target" ${d.dateType==='target'?'selected':''}>Finish by</option><option value="review" ${d.dateType==='review'?'selected':''}>Review on</option></select><input data-draft="date" type="date" min="${today()}" value="${esc(d.date)}"/></div></div>`;
if(d.step===2)h=`<h2 class="h2">What are your first moves?</h2><p class="muted small">Choose 1–3 doable actions. Your companion grows when you actually complete them.</p><div class="chips">${world(d.category).task.map(s=>`<button class="chip" data-suggest="${esc(s)}">+ ${esc(s)}</button>`).join('')}</div><div class="field"><label>Add your own action</label><div class="flex"><input id="w-action" maxlength="140" placeholder="e.g. Practise 10 minutes"/><button class="btn" data-act="w-add">Add</button></div></div>${d.tasks.length?d.tasks.map((t,i)=>`<div class="task"><span class="pill">${i+1}</span><b class="grow">${esc(t.title)}</b><button class="iconbtn" data-remove-wtask="${t.id}" aria-label="Remove">✕</button></div>`).join(''):'<div class="empty">Add your first action to move forward.</div>'}<div class="helper">Tip: “Study more” is vague. “Practise 10 questions on Tuesday” is an action you can check off.</div>`;
if(d.step===3)h=`<h2 class="h2">When will you take action?</h2><p class="muted small">Schedule your next seven days. Your entire goal does <b>not</b> need to finish this week.</p><div class="daygroups">${d.tasks.map(t=>`<div class="flex between wrap" style="padding:11px;border:1px solid #e9eaf3;border-radius:12px"><b class="grow">${esc(t.title)}</b><select data-date-task="${t.id}" style="width:auto;max-width:200px;border-radius:10px;padding:9px;border:1px solid #dce1ef"><option value="">Not this week</option>${week().map(v=>`<option value="${v}" ${d.schedule[t.id]===v?'selected':''}>${dayname(v)} ${dated(v)}</option>`).join('')}</select></div>`).join('')}</div><div class="helper">🌿 Leave free time. If the schedule feels packed, move something to next week. You can use Pomodoro sessions later.</div>`;
if(d.step===4)h=`<h2 class="h2">Your adventure is ready.</h2><p class="muted small">Review your plan. You can improve it whenever you learn something new.</p><div class="preview"><div class="eyebrow">YOUR GOAL CARD</div><h2 class="h2">${esc(d.title)}</h2><p><b>Success:</b> ${esc(d.success)}</p><p><b>${d.dateType==='target'?'Target date':'Review date'}:</b> ${dated(d.date)}</p><div><b>Your first actions:</b></div>${d.tasks.map(t=>`<div style="padding:6px 0">✓ ${esc(t.title)} · ${d.schedule[t.id]?`${dayname(d.schedule[t.id])} ${dated(d.schedule[t.id])}`:'Later'}</div>`).join('')}</div><div class="helper">✨ Once you create your goal, you'll unlock your own creature. You can choose SMART+ power-ups and complete a WOOP challenge any time.</div>`;
screen(`<div class="wizard"><div class="flex between" style="margin-bottom:13px"><div class="eyebrow">THE H4 GOAL MEETING METHOD</div><button class="btn line sm" data-act="wizard-exit">Save & exit</button></div><h1 class="h1" style="margin-bottom:17px">${steps[d.step]}</h1><div class="flex between small muted" style="margin-bottom:8px"><b>Step ${d.step+1} of 5</b><span>${steps[d.step]}</span></div><div class="steptrack">${steps.map((_,i)=>`<div class="${i===d.step?'current':i<d.step?'passed':''}"></div>`).join('')}</div><section class="card cardglow">${h}<hr class="mutedline"/><div class="flex between"><button class="btn line" data-act="wizard-prev">← Back</button><button class="btn" data-act="wizard-next">${d.step===4?'Create goal & meet my companion ✦':'Continue →'}</button></div></section></div>`)}
function startWizard(){state.draft=wizardBlank();navigate('wizard')};function finishWizard(){const d=state.draft;const g=goal(d.category,d.title.trim(),d.success.trim(),35,[]);g.date=d.date;g.dateType=d.dateType;g.why=d.why;g.agree=d.agree;g.realistic=d.realistic;g.tasks=d.tasks.map(t=>({id:id(),title:t.title,due:d.schedule[t.id]||shift(today(),7),doneAt:null,createdAt:new Date().toISOString()}));state.goals.push(g);state.selected=g.id;state.demo=false;state.draft=null;state.lessons.smart=true;navigate('detail');toast(`${world(g.category).name} joined your adventure! Complete actions to help it evolve.`)}
function showModal(inner){document.querySelector('#modalhost').innerHTML=`<div class="modalback" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Goal Quest dialog"><div class="flex between" style="margin-bottom:16px"><span class="micro">H4 GOAL QUEST</span><button class="iconbtn" data-act="close" aria-label="Close dialog">✕</button></div>${inner}</div></div>`}function closeModal(){document.querySelector('#modalhost').innerHTML=''}
function wheelLesson(){const ratings=worlds.map(w=>`<div class="wheelitem"><div class="flex between"><b>${w.icon} ${esc(w.label)}</b><span id="wheelval-${w.id}" class="pill">${state.wheel[w.id]||5}/10</span></div><input type="range" min="1" max="10" value="${state.wheel[w.id]||5}" data-wheel="${w.id}" aria-label="${esc(w.label)} satisfaction"/><div class="tiny muted">How satisfied do you feel? You can skip any category.</div></div>`).join('');showModal(`<h2>🧭 Discover your direction</h2><p class="small">These areas can spark ideas. They're personal—there's no perfect score. You don't have to rate everything.</p><div class="wheelgrid">${ratings}</div><div class="helper">A low score doesn't mean you're failing. Choose the area you feel most excited or ready to improve.</div><button class="btn full" data-act="wheel-finish">Done exploring</button>`)}
function lesson(k){if(k==='wheel')return wheelLesson();let g=current();if(!g&&k!=='smart')return toast('Create a goal first, then apply this lesson to it.');if(k==='smart'){showModal(`<h2>🎯 SMART Goals, the H4 way</h2><p>Five quick questions help turn an idea into a goal you can act on.</p><div class="stack" style="font-size:13px"><div><b>S — Specific:</b> Is your goal clear?</div><div><b>M — Measurable:</b> Can you track an outcome or actions?</div><div><b>A — Agreed Upon:</b> Is this your choice? Does your group agree?</div><div><b>R — Realistic:</b> Does it fit your skills and resources?</div><div><b>T — Timely:</b> Do you have a target or review date?</div></div><div class="helper">Example: “Get better at dance” → “Practise a 60-second routine three times each week and perform it by December.”</div><button class="btn full" data-act="learn-done" data-key="smart">I get it — back to my goals</button>`);return}
if(k==='smartplus'){showModal(`<h2>✨ SMART Goals+ power-ups</h2><p>Optional upgrades for your goal: <b>${esc(g.title)}</b></p><form id="plus-form"><div class="field"><label>Challenging — how hard does this feel? <span id="challenge-value">${g.plus.challenge}/10</span></label><input type="range" min="1" max="10" name="challenge" value="${g.plus.challenge}" oninput="document.getElementById('challenge-value').textContent=this.value+'/10'"/></div><div class="field"><label>Physical primer — what unique object will remind you?</label><input name="primer" value="${esc(g.plus.primer)}" placeholder="e.g. Dance shoes beside my door"/><div class="hint">Choose a physical cue tied only to this goal. Not a generic phone alert.</div></div><div class="field"><label>Accountability — who could check in with you?</label><input name="partner" value="${esc(g.plus.partner)}" placeholder="e.g. My teacher, teammate, or friend"/></div><label class="flex small" style="margin:16px 0"><input type="checkbox" name="contract" ${g.plus.contract?'checked':''} style="width:18px;height:18px"/> I commit to making a genuine effort toward this goal.</label><button class="btn full" type="submit">Save power-ups</button></form>`);return}
if(k==='woop'){showModal(`<h2>🛡️ WOOP: your obstacle shield</h2><p>Imagine the good outcome, identify what might stop you, and prepare one response.</p><form id="woop-form"><div class="field"><label>W — Wish: What do you want?</label><input name="wish" value="${esc(g.woop.wish)}" placeholder="I want to perform my dance routine"/></div><div class="field"><label>O — Opportunity (positive outcome): How will success feel?</label><input name="opportunity" value="${esc(g.woop.opportunity)}" placeholder="Proud and more confident"/></div><div class="field"><label>O — Obstacle: What might get in the way?</label><input name="obstacle" value="${esc(g.woop.obstacle)}" placeholder="I get distracted by my phone"/></div><div class="field"><label>P — Plan: If...then...</label><textarea name="plan" placeholder="If I get distracted, then I'll set my phone aside and practise 5 minutes.">${esc(g.woop.plan)}</textarea></div><button class="btn full" type="submit">Save my obstacle plan</button></form>`);return}
if(k==='planner'){showModal(`<h2>📅 Protect your week</h2><p>Goal-setting works better when you reserve time for tasks <b>and</b> time to rest.</p><div class="stack"><div class="preview">1. Identify a small next action.</div><div class="preview">2. Give it a specific day.</div><div class="preview">3. Use a 25-minute focus session and a 5-minute break if helpful.</div><div class="preview">4. Keep free time. Don't plan every minute.</div><div class="preview">5. Review after seven days and make the next plan.</div></div><button class="btn full" style="margin-top:16px" data-act="learn-done" data-key="planner" data-next="week">Plan my week →</button>`);return}
if(k==='partner'){showModal(`<h2>🤝 Choose an accountability partner</h2><p>A partner can ask what you've planned, what happened, and what comes next.</p><div class="preview">Make a short weekly meeting: <b>Review → Reflect → Adjust → Commit.</b></div><p class="small">Only share what you're comfortable sharing. This demo creates a message you choose to send—there is no live connection to other students.</p><button class="btn full" data-act="learn-done" data-key="partner" data-next="partner">Prepare a partner check-in →</button>`);return}}
function newTaskModal(date=today()){showModal(`<h2>+ Plan a new action</h2><p class="small">Short, specific tasks are easier to start.</p><form id="task-form"><div class="field"><label>What will you actually do?</label><input name="title" required maxlength="140" placeholder="Practise for 15 minutes" autofocus/></div><div class="field"><label>Which goal?</label><select name="goal">${state.goals.filter(g=>!g.archived).map(g=>`<option value="${g.id}" ${g.id===state.selected?'selected':''}>${esc(g.title)}</option>`).join('')}</select></div><div class="field"><label>When?</label><input name="date" type="date" min="${shift(today(),-30)}" value="${date}" required/></div><button class="btn full" type="submit">Add to my plan</button></form>`)}function taskById(tid){for(const g of state.goals){const t=g.tasks.find(t=>t.id===tid);if(t)return{g,t}}return null}function moveTask(tid){let f=taskById(tid);if(!f)return;showModal(`<h2>↗ Change your plan</h2><p>${esc(f.t.title)}</p><form id="move-form" data-task="${esc(tid)}"><div class="field"><label>Move task to</label><input type="date" name="date" required value="${f.t.due}"/></div><button class="btn full">Reschedule</button></form><p class="small">Adjusting your plan isn't failure. It's part of managing your goal.</p>`)}function goalEdit(){const g=current();showModal(`<h2>✎ Edit your goal</h2><form id="edit-form"><div class="field"><label>My goal</label><input name="title" required maxlength="120" value="${esc(g.title)}"/></div><div class="field"><label>Success looks like</label><textarea name="success" required>${esc(g.success)}</textarea></div><div class="field"><label>Target/review date</label><input name="date" type="date" value="${g.date}" required/></div><button class="btn full">Save changes</button></form>`)}function evidence(){showModal(`<h2>📓 Capture real progress</h2><p>Record what you actually tried, what happened, or what you learned. This journal can support a future Capstone portfolio.</p><form id="evidence-form"><div class="field"><label>What did you do or learn?</label><textarea name="text" placeholder="I asked my teacher for feedback and adjusted my plan..." required maxlength="700"></textarea></div><div class="field"><label>Evidence or artifact reference <span class="muted">(optional)</span></label><input name="evidence" maxlength="260" placeholder="e.g. photo of my practice / name of a document"/></div><button class="btn full">Save journal entry</button></form>`)}function checkin(){const last=state.journal.filter(x=>x.date===today()).at(-1);showModal(`<h2>✓ Your daily check-in</h2><p>Thirty seconds. Even a difficult day can teach you something.</p><form id="checkin-form"><div class="field"><label>How did today go?</label><select name="mood"><option value="progress" ${last?.mood==='progress'?'selected':''}>I made progress</option><option value="stuck" ${last?.mood==='stuck'?'selected':''}>I got stuck</option><option value="rest" ${last?.mood==='rest'?'selected':''}>I chose to rest</option></select></div><div class="field"><label>What did you learn or what comes next?</label><textarea name="note" placeholder="One sentence is enough">${esc(last?.note||'')}</textarea></div><button type="submit" class="btn full">Save today's reflection</button></form>`)}
function partner(){const g=current();if(!g)return;const s=taskCount(g),t=g.tasks.find(t=>!t.doneAt);let txt=`H4 Goal Meeting — accountability check-in\nMy goal: ${g.title}\nSuccess looks like: ${g.success}\nActions completed: ${s.n} of ${s.total}\nNext action: ${t?.title||'Plan a new step'}\nCould you check in with me this week about how it's going?\n(I'm choosing to share only this update.)`;showModal(`<h2>🤝 A little help goes a long way</h2><p>Send a check-in to someone you trust. This demo does not connect accounts or reveal your other private goals.</p><textarea id="share-text" readonly style="width:100%;height:190px;resize:vertical;padding:12px;border-radius:12px;border:1px solid #dce1ef">${esc(txt)}</textarea><button class="btn full" data-act="copy-share">Copy check-in message</button>`)}
function coachingPrompt(k,preview=false){const g=current();const text=prompts[k].text(g);if(preview){showModal(`<h2>${esc(prompts[k].title)}</h2><p>Preview the text before choosing to paste it into an external LLM.</p><textarea id="coach-preview" readonly style="width:100%;height:240px;resize:vertical;padding:12px;border:1px solid #dce1ef;border-radius:12px">${esc(text)}</textarea><button class="btn full" data-prompt="${k}">Copy prompt</button>`)}else copy(text,'Coaching prompt copied. Open your preferred LLM and paste it.')}
function copy(t,msg){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(()=>selectCopy(t))}else selectCopy(t)}function selectCopy(t){showModal(`<h2>Copy this text</h2><p>Long-press or select all to copy.</p><textarea readonly id="manual-copy" style="width:100%;height:240px;padding:12px;border-radius:12px;border:1px solid #dce1ef">${esc(t)}</textarea><button class="btn full" data-act="select-copy">Select text</button>`)}
function reminder(){showModal(`<h2>🔔 Choose your check-in time</h2><p>Because this is a standalone demo, it cannot send background push notifications. It can prepare a calendar event with a daily alert that you may import.</p><form id="reminder-form"><div class="field"><label>Daily check-in time</label><input type="time" name="time" value="19:00" required/></div><button class="btn full">Create calendar reminder (.ics)</button></form><div class="helper">For a physical goal-specific primer, choose SMART Goals+. Generic alerts aren't a replacement for meaningful cues.</div>`)}function calendarDownload(time){const [h,m]=time.split(':').map(Number);const start=new Date();start.setHours(h,m,0,0);if(start<=new Date())start.setDate(start.getDate()+1);const dt=v=>`${v.getFullYear()}${String(v.getMonth()+1).padStart(2,'0')}${String(v.getDate()).padStart(2,'0')}T${String(v.getHours()).padStart(2,'0')}${String(v.getMinutes()).padStart(2,'0')}${String(v.getSeconds()).padStart(2,'0')}`;const end=new Date(start.getTime()+10*60000);const content=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//H4//Goal Quest//EN\r\nBEGIN:VEVENT\r\nUID:${id()}@goalquest.local\r\nDTSTAMP:${dt(new Date())}\r\nDTSTART:${dt(start)}\r\nDTEND:${dt(end)}\r\nRRULE:FREQ=DAILY;COUNT=30\r\nSUMMARY:H4 Goal Quest daily check-in\r\nDESCRIPTION:Review today's actions and plan tomorrow.\r\nBEGIN:VALARM\r\nTRIGGER:-PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:Time for your H4 Goal Quest check-in\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;download(content,'H4-Goal-Quest-Reminder.ics','text/calendar;charset=utf-8')}
function download(data,name,mime){const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download(JSON.stringify({exportedAt:new Date().toISOString(),goals:state.goals,wheel:state.wheel,journal:state.journal},null,2),'H4-Goal-Quest-Backup.json','application/json');toast('Backup saved to your downloads.')}
function evolve(){const g=current(),s=stage(g);showModal(`<h2>✦ Meet ${esc(world(g.category).name)}</h2><p>Each goal grows one companion. Every real action helps its own character evolve.</p><div class="flex wrap" style="justify-content:center">${[1,2,3,4].map(i=>{let mock={...g,tasks:Array.from({length:Math.ceil((i-1)*145/35)},(_,j)=>({doneAt:new Date().toISOString()}))};mock.plus={};mock.woop={};mock.checkins=[];return `<div style="text-align:center;padding:5px;border:${i===s?'2px solid #7464e4':'1px solid #e8ebf3'};border-radius:12px;min-width:90px">${mascot(mock,85)}<div class="small"><b>Stage ${i}</b></div><div class="tiny muted">${i===s?'Current':i<s?'Unlocked':'To discover'}</div></div>`}).join('')}</div><div class="helper">Your companion's progress comes from its goal's completed actions and reflections, not idle app time.</div>`)}
function updateTimerText(){let e=document.querySelector('#timer-display');if(e)e.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;const btn=document.querySelector('#timer-toggle');if(btn)btn.textContent=running?'Pause focus':'Start focus'}function timerToggle(){if(running){running=false;clearInterval(timer);seconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));updateTimerText();return}running=true;timerEnd=Date.now()+seconds*1000;timer=setInterval(()=>{seconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));updateTimerText();if(seconds===0){clearInterval(timer);running=false;toast('Focus session done. Take a break, then record the real action you completed.')}},250);updateTimerText()}function timerReset(){clearInterval(timer);running=false;seconds=25*60;updateTimerText()}
function navigate(s){state.screen=s;screenRoute();window.scrollTo({top:0,behavior:'instant'})}function screenRoute(){if(state.screen==='home')home();else if(state.screen==='week')weekView();else if(state.screen==='goals')goalsView();else if(state.screen==='detail')detail();else if(state.screen==='path')learning();else if(state.screen==='coach')coach();else if(state.screen==='wizard')wizard();else home()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let k=b.dataset;if(k.nav){navigate(k.nav);return}if(k.goal){state.selected=k.goal;navigate('detail');return}if(k.lesson){lesson(k.lesson);return}if(k.prompt){coachingPrompt(k.prompt);return}if(k.promptView){coachingPrompt(k.promptView,true);return}if(k.category){state.draft.category=k.category;wizard();return}if(k.example){state.draft.title=k.example;wizard();return}if(k.suggest){if(!state.draft.tasks.some(x=>x.title===k.suggest))state.draft.tasks.push({id:id(),title:k.suggest});wizard();return}if(k.removeWtask){state.draft.tasks=state.draft.tasks.filter(x=>x.id!==k.removeWtask);wizard();return}if(k.done){const f=taskById(k.done);if(!f)return;f.t.doneAt=f.t.doneAt?null:new Date().toISOString();let xp=f.t.doneAt?'+35 XP toward '+world(f.g.category).name:'Action reopened';persist();screenRoute();toast(xp);return}if(k.move){moveTask(k.move);return}if(k.addDate){newTaskModal(k.addDate);return}if(k.minutes){clearInterval(timer);running=false;seconds=Number(k.minutes)*60;document.querySelectorAll('[data-minutes]').forEach(x=>x.classList.toggle('active',x===b));updateTimerText();return}let a=k.act;if(!a)return;
if(a==='new-goal'){if(state.draft){showModal(`<h2>Continue your goal?</h2><p>You have an unfinished goal idea saved.</p><div class="flex wrap"><button class="btn" data-act="resume-wizard">Continue my draft</button><button class="btn line" data-act="restart-wizard">Start fresh</button></div>`)}else startWizard()}
else if(a==='resume-wizard'){closeModal();navigate('wizard')}
else if(a==='restart-wizard'){closeModal();startWizard()}
else if(a==='wizard-next'){const d=state.draft;if(!d)return;if(d.step===0&&!d.title.trim())return toast('Start with one goal idea.');if(d.step===1){if(!d.title.trim()||!d.success.trim()||!d.date||!d.agree||!d.realistic.trim())return toast('Answer each SMART question so your goal is ready.');if(d.agree==='reconsider')return toast('Adjust the goal until it feels right to you.')}if(d.step===2&&!d.tasks.length)return toast('Choose at least one real action.');if(d.step===3&&!d.tasks.some(t=>d.schedule[t.id]))return toast('Choose at least one action to schedule this week.');if(d.step<4){d.step++;wizard()}else finishWizard()}
else if(a==='wizard-prev'){if(state.draft.step>0){state.draft.step--;wizard()}else navigate('goals')}
else if(a==='wizard-exit'){toast('Your draft is saved on this device.');navigate('goals')}
else if(a==='w-add'){const i=document.querySelector('#w-action');if(!i?.value.trim())return toast('Write an action first.');state.draft.tasks.push({id:id(),title:i.value.trim().slice(0,140)});wizard()}
else if(a==='add-task')newTaskModal()
else if(a==='checkin')checkin()
else if(a==='evidence')evidence()
else if(a==='edit-goal')goalEdit()
else if(a==='close')closeModal()
else if(a==='wheel-finish'){state.lessons.wheel=true;persist();closeModal();toast('Direction explored! Choose any area you care about.')}
else if(a==='learn-done'){state.lessons[k.key]=true;persist();closeModal();if(k.next==='week')navigate('week');else if(k.next==='partner')partner();else{screenRoute();toast('Lesson explored! Try it with your goal.')}}
else if(a==='partner')partner()
else if(a==='copy-share'){copy(document.querySelector('#share-text').value,'Your check-in is copied. You choose who to send it to.');closeModal()}
else if(a==='select-copy'){const input=document.querySelector('#manual-copy');input?.focus();input?.select()}
else if(a==='timer-toggle')timerToggle()
else if(a==='timer-reset')timerReset()
else if(a==='reminder')reminder()
else if(a==='evolution')evolve()
else if(a==='backup')backup()
else if(a==='reset-demo'){if(confirm('Reset this prototype to its sample goals? All local demo changes will be lost.')){state=initial();closeModal();navigate('home');toast('Demo reset.')}}
});
document.addEventListener('input',e=>{const o=e.target;if(o.dataset.draft&&state.draft){state.draft[o.dataset.draft]=o.value;persist()}if(o.dataset.wheel){state.wheel[o.dataset.wheel]=Number(o.value);const v=document.querySelector('#wheelval-'+o.dataset.wheel);if(v)v.textContent=o.value+'/10';persist()}});
document.addEventListener('change',e=>{let o=e.target;if(o.dataset.dateTask&&state.draft){state.draft.schedule[o.dataset.dateTask]=o.value;persist()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='w-action'){e.preventDefault();document.querySelector('[data-act="w-add"]')?.click()}if(e.key==='Escape')closeModal()});
document.addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const data=Object.fromEntries(new FormData(form));const g=current();if(form.id==='task-form'){const goal=state.goals.find(x=>x.id===data.goal);if(!goal||!data.title.trim()||!data.date)return;goal.tasks.push({id:id(),title:data.title.trim().slice(0,140),due:data.date,doneAt:null,createdAt:new Date().toISOString()});closeModal();screenRoute();toast('Action planned!')}
else if(form.id==='move-form'){let f=taskById(form.dataset.task);if(f){f.t.due=data.date;closeModal();screenRoute();toast('Task rescheduled.')}}
else if(form.id==='edit-form'&&g){g.title=data.title.trim().slice(0,120);g.success=data.success.trim();g.date=data.date;closeModal();screenRoute();toast('Your goal was updated.')}});
document.addEventListener('submit',e=>{const form=e.target;if(!['plus-form','woop-form','evidence-form','checkin-form','reminder-form'].includes(form.id))return;e.preventDefault();const data=Object.fromEntries(new FormData(form));const g=current();if(form.id==='plus-form'&&g){let primer=(data.primer||'').trim().slice(0,120);if(primer&&state.goals.some(x=>x.id!==g.id&&x.plus?.primer?.toLowerCase()===primer.toLowerCase()))return toast('Choose a unique physical primer for each goal.');g.plus={challenge:Number(data.challenge||5),primer,partner:(data.partner||'').trim().slice(0,120),contract:Boolean(data.contract)};state.lessons.smartplus=true;closeModal();screenRoute();toast('SMART Goals+ power-ups saved!')}
else if(form.id==='woop-form'&&g){g.woop={wish:(data.wish||'').trim(),opportunity:(data.opportunity||'').trim(),obstacle:(data.obstacle||'').trim(),plan:(data.plan||'').trim()};state.lessons.woop=true;closeModal();screenRoute();toast('Obstacle plan equipped!')}
else if(form.id==='evidence-form'&&g){if(!data.text.trim())return;g.notes||=[];g.notes.push({date:today(),text:data.text.trim().slice(0,700),evidence:(data.evidence||'').trim().slice(0,260)});closeModal();screenRoute();toast('Progress evidence recorded.')}
else if(form.id==='checkin-form'){const last=state.journal.find(x=>x.date===today());if(last){last.mood=data.mood;last.note=(data.note||'').trim().slice(0,350)}else state.journal.push({date:today(),mood:data.mood,note:(data.note||'').trim().slice(0,350)});if(g&&!g.checkins.some(c=>c.date===today()))g.checkins.push({date:today(),mood:data.mood});closeModal();screenRoute();toast('Check-in saved. Your reflection matters!')}
else if(form.id==='reminder-form'){calendarDownload(data.time);closeModal();toast('Calendar reminder downloaded. Import it into your calendar app.')}});
// Optional demo utilities: visible only after using Settings below.
const originalGoals=goalsView;goalsView=function(){originalGoals();const e=document.querySelector('#main > .card');if(e){e.insertAdjacentHTML('beforeend',`<div style="border-top:1px solid #eceef5;padding-top:16px;margin-top:25px"><div class="flex between wrap"><span class="small muted">This is a local demo. Nothing is shared or uploaded.</span><div class="flex wrap"><button class="btn line sm" data-act="backup">Export goal backup</button><button class="btn line sm" data-act="reset-demo">Reset demo</button></div></div></div>`)}};
const oldQuest=quest;quest=function(g){return oldQuest(g).replace('</div></div></div>', '</div></div></div>') .replace('<div class="tiny muted" style="margin-top:8px">', '<button class="btn sm light" style="margin-top:13px;width:100%" data-act="evolution">See my evolution path ✦</button><div class="tiny muted" style="margin-top:8px">')};
screenRoute();
})();
</script></body></html>
